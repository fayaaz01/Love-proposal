<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕷️ Every Season — Spider-Man Edition ❤️</title>
    <meta name="description" content="You are my every season — a Spider-Man themed love message">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="seasons-theme fate-theme">

    <div class="seasons-container fate-container">

        <h1 class="fate-title">Our red thread of fate</h1>

        <div class="fate-emoji-row">
            <span>💗</span>
            <span>✨</span>
            <span>💗</span>
        </div>

        <div class="fate-subtitle">
            BOUND BY LOVE, DESTINY, AND TIME
        </div>

        <div class="fate-story">
            <h2>Connect our hearts</h2>
            <p>Click the glowing heart three times.</p>
        </div>

        <div class="fate-diagram"
            aria-label="Connection diagram between two hidden memories">

            <!-- LEFT MEMORY -->
            <div class="memory memory-left">
                <img
                    class="memory-photo"
                    src="Manooj.jpeg"
                    alt="Memory of Manooj">
            </div>

            <!-- RIGHT MEMORY -->
            <div class="memory memory-right">
                <img
                    class="memory-photo"
                    src="Yedi.jpeg"
                    alt="Memory of Yedi">
            </div>

            <!-- CENTER HEART -->
            <div class="love-bridge">

                <div class="glow-ring"></div>

                <button
                    class="love-button"
                    type="button"
                    aria-label="Connect our hearts">

                    <span>❤</span>

                </button>

            </div>


            <!-- CONNECTION CURVES -->
            <svg
                class="fate-curve"
                viewBox="0 0 760 230"
                preserveAspectRatio="none"
                aria-hidden="true">

                <path
                    class="fate-arc fate-arc-left"
                    d="M 52 162 C 150 142, 240 146, 350 162" />

                <path
                    class="fate-arc fate-arc-right"
                    d="M 708 162 C 610 142, 520 146, 410 162" />

            </svg>

        </div>


        <div class="nav-buttons" style="margin-top: 2.5rem;">

            <a href="memories.html" class="btn-back">
                ⬅️ Back
            </a>

        </div>

    </div>


    <script>

        const fateDiagram =
            document.querySelector('.fate-diagram');

        const loveButton =
            document.querySelector('.love-button');

        const curvePaths =
            document.querySelectorAll('.fate-curve path');

            const leftMemory =
                document.querySelector('.memory-left');

            const rightMemory =
                document.querySelector('.memory-right');

            const loveBridge =
                document.querySelector('.love-bridge');


        if (
            fateDiagram &&
            loveButton &&
            curvePaths.length
        ) {

            let clickCount = 0;


            /*
             * Connection stages
             *
             * 0 = Nothing
             * 1 = First click
             * 2 = Second click
             * 3 = Third click → reveal photos
             */

            const buildArcPaths = (step) => {

                const diagramRect =
                    fateDiagram.getBoundingClientRect();

                const toSvgPoint = (x, y) => ({
                    x: ((x - diagramRect.left) / diagramRect.width) * 760,
                    y: ((y - diagramRect.top) / diagramRect.height) * 230
                });

                const leftRect = leftMemory.getBoundingClientRect();
                const rightRect = rightMemory.getBoundingClientRect();
                const heartRect = loveBridge.getBoundingClientRect();

                const leftStart = toSvgPoint(
                    leftRect.right,
                    leftRect.top + leftRect.height / 2
                );

                const rightStart = toSvgPoint(
                    rightRect.left,
                    rightRect.top + rightRect.height / 2
                );

                const leftEnd = toSvgPoint(
                    heartRect.left,
                    heartRect.top + heartRect.height / 2
                );

                const rightEnd = toSvgPoint(
                    heartRect.right,
                    heartRect.top + heartRect.height / 2
                );

                const lift = [26, 18, 10, 0][step] || 0;
                const leftSpan = leftEnd.x - leftStart.x;
                const rightSpan = rightStart.x - rightEnd.x;

                return {
                    left:
                        `M ${leftStart.x} ${leftStart.y} C ${leftStart.x + leftSpan * 0.35} ${leftStart.y - lift}, ${leftEnd.x - leftSpan * 0.35} ${leftEnd.y - lift}, ${leftEnd.x} ${leftEnd.y}`,

                    right:
                        `M ${rightStart.x} ${rightStart.y} C ${rightStart.x - rightSpan * 0.35} ${rightStart.y - lift}, ${rightEnd.x + rightSpan * 0.35} ${rightEnd.y - lift}, ${rightEnd.x} ${rightEnd.y}`
                };
            };


            /*
             * Apply the current connection stage
             */

            const applyStep = (step) => {

                fateDiagram.setAttribute(
                    'data-step',
                    String(step)
                );


                /*
                 * Heart animation
                 */

                loveButton.classList.toggle(
                    'pulse',
                    step > 0
                );


                /*
                 * Once the third click happens,
                 * reveal both photos simultaneously.
                 */

                if (step >= 3) {

                    fateDiagram.classList.add(
                        'photos-revealed'
                    );

                }


                /*
                 * Update connecting curves
                 */

                const selected =
                    buildArcPaths(step);


                curvePaths[0].setAttribute(
                    'd',
                    selected.left
                );

                curvePaths[1].setAttribute(
                    'd',
                    selected.right
                );

            };


            /*
             * HEART CLICK
             */

            loveButton.addEventListener(
                'click',
                () => {

                    /*
                     * Only count up to 3.
                     * The photos stay revealed afterwards.
                     */

                    if (clickCount < 3) {

                        clickCount++;

                        applyStep(clickCount);

                    }

                }
            );


            /*
             * Initial state
             *
             * Photos are hidden.
             */

            applyStep(0);

            window.addEventListener(
                'resize',
                () => applyStep(clickCount)
            );

        }

    </script>

</body>

</html>
